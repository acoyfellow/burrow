# One file per coil instance.
# Copy to deploy/<instance>.conf (git ignores it), fill it in, then:
#   bun run ship -- deploy/<instance>.conf

# Cloudflare account that owns the zone, the Worker, and the containers.
COIL_ACCOUNT_ID=

# Hostname for the Worker, on a zone in that account.
COIL_DOMAIN=coil.example.com

# How people sign in. One mode per instance; ship refuses a host that does not match it.
#   access     A Zero Trust Access application in front (the default).
#   cloudflare Sign in with Cloudflare (OAuth). No Access application on this host.
#              Each user's threads run on their own Workers AI and AI Gateway.
COIL_AUTH=access

# access: the Access application whose hostname is exactly COIL_DOMAIN.
COIL_ACCESS_TEAM=https://your-team.cloudflareaccess.com
COIL_ACCESS_AUD=

# cloudflare: an OAuth client from Manage Account > OAuth clients, with the
# redirect URL https://COIL_DOMAIN/oauth/callback. Store its secret and a random
# session key of at least 32 characters as Worker secrets before you ship:
#   npx wrangler secret put OAUTH_CLIENT_SECRET -c wrangler.<instance>.local.jsonc
#   openssl rand -hex 32 | npx wrangler secret put SESSION_SECRET -c wrangler.<instance>.local.jsonc
# COIL_OAUTH_CLIENT_ID=
# The AI Gateway name used in each user's account (default: default).
# COIL_USER_GATEWAY=default

# nix-cf-proof base image in this account's registry.
NIX_IMAGE=registry.cloudflare.com/ACCOUNT_ID/nix-cf-proof:TAG

# Optional: default Workers AI model for new threads.
# COIL_MODEL=@cf/zai-org/glm-5.3

# Optional: AI Gateway in this account for gateway/* models (unified billing).
# COIL_AI_GATEWAY=default

# Optional: an OpenAI- and Anthropic-compatible gateway outside this account.
# coil calls <url>/openai and <url>/anthropic and sends the token in this header.
# The token command runs on your machine at deploy time; its output is stored
# as the Worker secret MODEL_GATEWAY_TOKEN and is never written to disk.
# COIL_MODEL_GATEWAY_URL=https://llm-gateway.example.com
# COIL_MODEL_GATEWAY_HEADER=authorization
# COIL_MODEL_GATEWAY_TOKEN_COMMAND='printf "Bearer %s" "$MY_GATEWAY_KEY"'
